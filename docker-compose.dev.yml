version: '3.8'

services:
  kcc-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      # Mount the entire project directory
      - .:/workspace
      # Persist Go module cache
      - go-mod-cache:/go/pkg/mod
      # Persist Go build cache
      - go-build-cache:/root/.cache/go-build
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  go-mod-cache:
  go-build-cache:
